<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Muted Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B785" />
      <stop offset="100%" stop-color="#C5915D" />
    </linearGradient>
    
    <!-- Primary Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#41846A" />
      <stop offset="100%" stop-color="#2E5B5E" />
    </linearGradient>
    
    <!-- Dark Teal for Depth -->
    <linearGradient id="tealDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E5B5E" />
      <stop offset="100%" stop-color="#1B383A" />
    </linearGradient>
  </defs>

  <!-- Background glow (optional) -->
  <circle cx="200" cy="180" r="100" fill="url(#goldGrad)" opacity="0.05" />

  <!-- Outer Dome Arch -->
  <path d="M 70,285 C 70,140 130,90 200,40 C 270,90 330,140 330,285" fill="none" stroke="url(#tealGrad)" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Inner Dome Arch -->
  <path d="M 115,275 C 115,160 155,120 200,75 C 245,120 285,160 285,275" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Finial and Crescent on top of the dome -->
  <circle cx="200" cy="35" r="5" fill="url(#goldGrad)"/>
  <path d="M 200,30 L 200,10" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 188,10 A 13,13 0 1,0 212,10 A 10,10 0 1,1 188,10 Z" fill="url(#goldGrad)"/>

  <!-- Central 8-Pointed Star (Spark of Knowledge) -->
  <g transform="translate(200, 180)">
    <g fill="url(#goldGrad)">
      <polygon points="0,-35 8,-10 35,0 8,10 0,35 -8,10 -35,0 -8,-10"/>
      <polygon points="0,-35 8,-10 35,0 8,10 0,35 -8,10 -35,0 -8,-10" transform="rotate(45)"/>
    </g>
    <!-- Inner star detail -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Open Book (Back Pages) -->
  <path d="M 200,280 Q 130,240 55,275 L 55,295 Q 130,260 200,300 Z" fill="url(#goldGrad)"/>
  <path d="M 200,280 Q 270,240 345,275 L 345,295 Q 270,260 200,300 Z" fill="url(#goldGrad)"/>
  
  <!-- Open Book (Middle Pages) -->
  <path d="M 200,290 Q 130,250 45,285 L 45,310 Q 130,270 200,315 Z" fill="#FFFFFF"/>
  <path d="M 200,290 Q 270,250 355,285 L 355,310 Q 270,270 200,315 Z" fill="#FFFFFF"/>

  <!-- Open Book (Front Cover) -->
  <path d="M 200,305 Q 130,265 40,295 L 40,330 Q 130,295 200,340 Z" fill="url(#tealDarkGrad)"/>
  <path d="M 200,305 Q 270,265 360,295 L 360,330 Q 270,295 200,340 Z" fill="url(#tealDarkGrad)"/>

  <!-- Book Spine Center detail -->
  <path d="M 200,280 L 200,340" stroke="#1B383A" stroke-width="4" stroke-linecap="round"/>
</svg>
